name: Modular Linux Release

on:
  push:
    branches:
      - linux-electron
    tags:
      - 'v*-internetisalie.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-release:
    name: Build Linux desktop and web packages
    runs-on: ubuntu-24.04
    outputs:
      archive_name: ${{ steps.archive.outputs.name }}
      version: ${{ steps.version.outputs.app }}
    steps:
      - name: Checkout linux-electron
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify native Linux architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(node -p 'process.arch')" = "x64"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read application version
        id: version
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./packages/electron/package.json').version")
          SDK_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          WEB_VERSION=$(node -p "require('./packages/web/package.json').version")
          test "$SDK_VERSION" = "$APP_VERSION"
          test "$WEB_VERSION" = "$APP_VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          fi
          echo "app=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run focused Electron release tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

      - name: Build installable SDK and web packages
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.app }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/npm
          bun run --cwd packages/sdk build
          bun run build:web
          bun pm pack --cwd packages/sdk --destination "$GITHUB_WORKSPACE/artifacts/npm"
          bun pm pack --cwd packages/web --destination "$GITHUB_WORKSPACE/artifacts/npm"
          test -f "artifacts/npm/openchamber-sdk-$PACKAGE_VERSION.tgz"
          test -f "artifacts/npm/openchamber-web-$PACKAGE_VERSION.tgz"

      - name: Verify packed SDK and web installation
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.app }}
        run: |
          set -euo pipefail
          CONSUMER=$(mktemp -d "$RUNNER_TEMP/openchamber-web-consumer.XXXXXX")
          npm install --prefix "$CONSUMER" --no-audit --no-fund \
            "$GITHUB_WORKSPACE/artifacts/npm/openchamber-sdk-$PACKAGE_VERSION.tgz" \
            "$GITHUB_WORKSPACE/artifacts/npm/openchamber-web-$PACKAGE_VERSION.tgz"
          cd "$CONSUMER"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          await import('@openchamber/sdk');
          await import('@openchamber/sdk/ui');
          await import('@openchamber/sdk/schemas');
          const sdk = JSON.parse(readFileSync('node_modules/@openchamber/sdk/package.json', 'utf8'));
          const web = JSON.parse(readFileSync('node_modules/@openchamber/web/package.json', 'utf8'));
          assert.equal(sdk.version, process.env.PACKAGE_VERSION);
          assert.equal(web.version, process.env.PACKAGE_VERSION);
          assert.equal(web.dependencies['@openchamber/sdk'], process.env.PACKAGE_VERSION);
          NODE
          test "$(./node_modules/.bin/openchamber --version)" = "$PACKAGE_VERSION"
          cd "$GITHUB_WORKSPACE/artifacts/npm"
          sha256sum *.tgz > "openchamber-npm-packages-$PACKAGE_VERSION.sha256"

      - name: Build unpacked Linux application
        working-directory: packages/electron
        env:
          OPENCHAMBER_TARGET_ARCH: x64
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          node ./scripts/package.mjs --linux dir --x64 --publish=never
          bun run verify:opencode-cli:packaged
          bun run verify:linux-directory

      - name: Create tarball
        id: archive
        working-directory: packages/electron
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          set -euo pipefail
          ARCHIVE_NAME="OpenChamber-${APP_VERSION}-linux-x86_64"
          tar -C dist --transform="s,^linux-unpacked,${ARCHIVE_NAME}," -czf "dist/${ARCHIVE_NAME}.tar.gz" linux-unpacked
          HASH=$(sha256sum "dist/${ARCHIVE_NAME}.tar.gz" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$HASH" "${ARCHIVE_NAME}.tar.gz" > "dist/${ARCHIVE_NAME}.tar.gz.sha256"
          echo "name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Linux tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            packages/electron/dist/${{ steps.archive.outputs.name }}.tar.gz
            packages/electron/dist/${{ steps.archive.outputs.name }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload SDK and web packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenChamber-${{ steps.version.outputs.app }}-npm-packages
          path: artifacts/npm/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-custom-release:
    name: Publish custom release assets
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build-linux-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-linux-release.outputs.archive_name }}
          path: release-assets

      - name: Download SDK and web packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: OpenChamber-${{ needs.build-linux-release.outputs.version }}-npm-packages
          path: release-assets

      - name: Upload custom release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: release-assets/*
          fail_on_unmatched_files: true
