name: Fork Linux Tarball

on:
  push:
    tags:
      - 'v*-internetisalie.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-electron:
    name: Build Linux Electron (x64 tarball)
    runs-on: ubuntu-24.04
    outputs:
      archive_name: ${{ steps.archive.outputs.name }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify native Linux architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(node -p 'process.arch')" = "x64"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read application version
        id: version
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./packages/electron/package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [[ "$GITHUB_REF_NAME" == "v${APP_VERSION}-internetisalie."* ]]
          fi
          echo "app=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run focused Electron release tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

      - name: Build unpacked Linux application
        working-directory: packages/electron
        env:
          OPENCHAMBER_TARGET_ARCH: x64
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          node ./scripts/package.mjs --linux dir --x64 --publish=never
          bun run verify:opencode-cli:packaged
          bun run verify:linux-directory

      - name: Create tarball
        id: archive
        working-directory: packages/electron
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          set -euo pipefail
          ARCHIVE_NAME="OpenChamber-${APP_VERSION}-linux-x86_64"
          tar -C dist --transform="s,^linux-unpacked,${ARCHIVE_NAME}," -czf "dist/${ARCHIVE_NAME}.tar.gz" linux-unpacked
          HASH=$(sha256sum "dist/${ARCHIVE_NAME}.tar.gz" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$HASH" "${ARCHIVE_NAME}.tar.gz" > "dist/${ARCHIVE_NAME}.tar.gz.sha256"
          (cd dist && sha256sum --check "${ARCHIVE_NAME}.tar.gz.sha256")
          echo "name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Linux tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            packages/electron/dist/${{ steps.archive.outputs.name }}.tar.gz
            packages/electron/dist/${{ steps.archive.outputs.name }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-custom-release:
    name: Publish fork tarball
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build-linux-electron
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-linux-electron.outputs.archive_name }}
          path: release-assets

      - name: Upload fork release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: release-assets/*
          fail_on_unmatched_files: true
