name: loom OpenChamber server image

on:
  pull_request:
    branches: [v2.0.1-internetisalie-trunk]
    paths:
      - .github/workflows/loom-server-image.yml
      - Dockerfile
      - scripts/docker-entrypoint.sh
      - packages/web/**
      - packages/ui/**
      - package.json
      - bun.lock
  push:
    branches: [v2.0.1-internetisalie-trunk]
    tags: [loom-image-*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'internetisalie/openchamber'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/internetisalie/openchamber:${{ github.sha }}
